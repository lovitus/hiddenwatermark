name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Run Automated Validation Tests
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Add and Sync Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/hiddenwatermark.jks
          python3 - <<'PY'
          path = 'android/app/build.gradle'
          src = open(path).read()
          assert '    buildTypes {' in src, 'buildTypes block not found'
          signing = '\n'.join([
              '    signingConfigs {',
              '        hiddenwatermark {',
              "            storeFile file('hiddenwatermark.jks')",
              "            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')",
              "            keyAlias System.getenv('ANDROID_KEY_ALIAS')",
              "            keyPassword System.getenv('ANDROID_KEY_PASSWORD')",
              '        }',
              '    }',
          ]) + '\n'
          debug = '\n'.join([
              '        debug {',
              '            signingConfig signingConfigs.hiddenwatermark',
              '        }',
          ]) + '\n'
          src = src.replace('    buildTypes {', signing + '    buildTypes {\n' + debug, 1)
          open(path, 'w').write(src)
          PY

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
